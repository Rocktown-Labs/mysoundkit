# Electron Forge packages dependencies by walking a conventional node_modules tree.
nodeLinker: hoisted
# Forge currently depends on the Git-hosted @electron/node-gyp package.
blockExoticSubdeps: false

packages:
  - apps/*
  - packages/*

allowBuilds:
  "@sentry/cli": true
  core-js: true
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  workerd: true

# Pin react/react-dom to the version the apps resolve so library peers can
# never dedupe against a second copy (a nested react inside
# @tanstack/react-query after the #262 lockfile regen made every SSR route
# 500 with "Cannot read properties of null (reading 'useEffect')" — see
# #356). Keep in sync with the react/react-dom ranges in apps/*/package.json.
overrides:
  react: 19.2.7
  react-dom: 19.2.7

catalog:
  dotenv: ^17.2.2
  zod: ^4.1.13
  "@types/node": ^22.13.14
  "@cloudflare/workers-types": ^4.20251213.0
  better-auth: 1.5.5
  ai: ^6.0.3
  alchemy: 2.0.0-beta.79
  effect: 4.0.0-rc.117
  "@effect/platform-node": 4.0.0-rc.117
  wrangler: ^4.77.0
  lucide-react: ^0.546.0
  next-themes: ^0.4.6
  sonner: ^2.0.5
  tailwindcss: ^4.1.18
  "@tanstack/react-form": ^1.28.0
  "@ai-sdk/react": ^3.0.3
  "@types/react-dom": ^19.2.3
  "@better-auth/expo": 1.5.5

minimumReleaseAgeExclude:
  - electron@44.1.1

patchedDependencies:
  '@distilled.cloud/cloudflare@1.0.0-rc.12': patches/@distilled.cloud__cloudflare@1.0.0-rc.12.patch
