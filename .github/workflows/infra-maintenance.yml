name: Infra Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which maintenance task to run"
        required: true
        default: audit-v1-workflows
        type: choice
        options:
          - audit-v1-workflows
          - set-r2-secrets
          - stripe-refund-events
          - diagnose-pipelines-auth
          - printful-catalog

      apply_refund_events:
        description: "Apply only missing refund lifecycle subscriptions to existing SoundKit webhooks"
        required: false
        default: false
        type: boolean

      show_token_name:
        description: "Include the token label (never its value) in auth diagnostics"
        required: false
        default: false
        type: boolean

      apply_printful_catalog:
        description: "Enable only verified matching Printful blanks in the production catalog"
        required: false
        default: false
        type: boolean

concurrency:
  group: infra-maintenance
  cancel-in-progress: false

jobs:
  printful-catalog:
    name: Verify Fourthwall model matches against Printful
    if: ${{ inputs.task == 'printful-catalog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and pnpm
        if: ${{ inputs.apply_printful_catalog }}
        uses: ./.github/actions/setup-node-pnpm
      - name: Install catalog database client
        if: ${{ inputs.apply_printful_catalog }}
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @soundkit/db
      - name: Audit live provider catalog
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          DATABASE_URL: ${{ inputs.apply_printful_catalog && secrets.DATABASE_URL || '' }}
          APPLY_PRINTFUL_CATALOG: ${{ inputs.apply_printful_catalog }}
        run: node scripts/ci/printful-catalog-enable.mjs
      - name: Record catalog audit
        if: always()
        run: |
          if test -f printful-catalog-report.json; then
            echo '## Printful catalog audit' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat printful-catalog-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  audit-v1-workflows:
    name: Audit workflow definitions and instance states
    if: ${{ inputs.task == 'audit-v1-workflows' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run the audit script
        run: bash scripts/ci/audit-v1-workflows.sh

  set-r2-secrets:
    name: Publish R2 deploy secrets as repository secrets
    if: ${{ inputs.task == 'set-r2-secrets' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      GH_SECRETS_WRITER_TOKEN: ${{ secrets.SECRETS_WRITER_TOKEN }}
      PUBLISH_GH_SECRETS: "true"
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Read v1 state store and publish secrets
        run: |
          set -euo pipefail
          SEED_DIR="$(mktemp -d)"
          cp scripts/ci/seed-v2-r2-secrets.mjs "$SEED_DIR/"
          cd "$SEED_DIR"
          echo '{"name":"seed","private":true}' > package.json
          pnpm add alchemy@0.90.1 --ignore-scripts
          node seed-v2-r2-secrets.mjs /dev/null

  stripe-refund-events:
    name: Verify or add SoundKit refund event subscriptions
    if: ${{ inputs.task == 'stripe-refund-events' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    permissions:
      contents: read
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      APPLY_REFUND_EVENTS: ${{ inputs.apply_refund_events }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/ci/stripe-refund-events.mjs

  diagnose-pipelines-auth:
    name: Diagnose Pipeline authentication (read only)
    if: ${{ inputs.task == 'diagnose-pipelines-auth' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: preview
    permissions:
      contents: read
    env:
      SOUNDKIT_DIAGNOSTIC_TOKEN_NAME: ${{ inputs.show_token_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe CI token without exposing credentials
        run: node scripts/ci/diagnose-pipelines-auth.mjs
