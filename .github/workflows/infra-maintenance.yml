name: Infra Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which maintenance task to run"
        required: true
        default: audit-v1-workflows
        type: choice
        options:
          - audit-v1-workflows
          - set-r2-secrets

concurrency:
  group: infra-maintenance
  cancel-in-progress: false

jobs:
  audit-v1-workflows:
    name: Audit workflow definitions and instance states
    if: ${{ inputs.task == 'audit-v1-workflows' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run the audit script
        run: bash scripts/ci/audit-v1-workflows.sh

  set-r2-secrets:
    name: Publish R2 deploy secrets as repository secrets
    if: ${{ inputs.task == 'set-r2-secrets' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      GH_SECRETS_WRITER_TOKEN: ${{ secrets.SECRETS_WRITER_TOKEN }}
      PUBLISH_GH_SECRETS: "true"
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Read v1 state store and publish secrets
        run: |
          set -euo pipefail
          SEED_DIR="$(mktemp -d)"
          cp scripts/ci/seed-v2-r2-secrets.mjs "$SEED_DIR/"
          cd "$SEED_DIR"
          echo '{"name":"seed","private":true}' > package.json
          pnpm add alchemy@0.90.1 --ignore-scripts
          node seed-v2-r2-secrets.mjs /dev/null
