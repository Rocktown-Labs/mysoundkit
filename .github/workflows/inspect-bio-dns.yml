name: Inspect Bio DNS

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize

jobs:
  inspect:
    name: Inspect Bio DNS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect Cloudflare records and worker domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON: ${{ secrets.ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail

          auth_header="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "Alchemy credential keys:"
          jq -r 'keys | join(",")' <<< "$ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON"

          echo "Worker custom domains:"
          curl --fail --silent --show-error \
            -H "$auth_header" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?per_page=100" \
            | jq -c '.result[] | select(.hostname == "soundkit.bio" or .hostname == "www.soundkit.bio" or .hostname == "bio.mysoundkit.com") | {id, hostname, zone_id, service, environment}'
