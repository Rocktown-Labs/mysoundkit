name: Verify and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:

# Active PR runs are latest-commit-wins per PR. Closed PR cleanup uses a separate
# group so it can start without waiting behind an active browser smoke run.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.action == 'closed' && format('pr-close-{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    env:
      SOUNDKIT_CI_STATIC_CONFIG: "true"
    permissions:
      contents: read
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification suite (types, hooks, tests, build)
        run: pnpm run verify

  browser:
    name: Browser Smoke Tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    env:
      SOUNDKIT_CI_STATIC_CONFIG: "true"
    permissions:
      contents: read
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser smoke tests
        run: pnpm run test:e2e

      - name: Report Playwright failure artifacts
        if: failure()
        run: |
          echo "Playwright failure artifacts remain available in the runner workspace for this run." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Production
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOYS == 'true' }}
    needs:
      - verify
      - browser
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production database schema
        working-directory: packages/db
        run: |
          node --input-type=module --eval '
          import { Pool } from "pg";

          const databaseUrl = process.env.DATABASE_URL?.replace(
            "sslmode=verify-full",
            "sslmode=require"
          );

          if (!databaseUrl) {
            throw new Error("DATABASE_URL is required to apply the production database schema.");
          }

          const pool = new Pool({ connectionString: databaseUrl, max: 1 });

          try {
            await pool.query("create extension if not exists vector");
          } finally {
            await pool.end();
          }
          '
          export DATABASE_URL="${DATABASE_URL/sslmode=verify-full/sslmode=require}"
          pnpm exec drizzle-kit push --config drizzle.config.ts --force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy through Alchemy
        working-directory: packages/infra
        run: |
          ALCHEMY_STATE_FORCE_UPDATE=true pnpm run deploy && exit 0
          echo "Production deploy refreshed the Alchemy state worker. Retrying after propagation..."
          sleep 30
          for attempt in 2 3; do
            ALCHEMY_STATE_FORCE_UPDATE=false pnpm run deploy && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Production deploy still failed after state refresh. Retrying in 30 seconds..."
            sleep 30
          done
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_API_TOKEN }}
          CLOUDFLARE_STREAM_CUSTOMER_CODE: ${{ vars.CLOUDFLARE_STREAM_CUSTOMER_CODE }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ vars.ALCHEMY_STATE_FORCE_UPDATE }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REALTIMEKIT_APP_ID: ${{ vars.CLOUDFLARE_REALTIMEKIT_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_SERVER_DSN }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_SOUNDKIT_PREMIUM_ARTIST_ANNUAL_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_ARTIST_ANNUAL_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_ARTIST_MONTHLY_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_ARTIST_MONTHLY_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_FAN_ANNUAL_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_FAN_ANNUAL_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_FAN_MONTHLY_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_FAN_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_BETTER_AUTH_WEBHOOK_SECRET: ${{ secrets.STRIPE_BETTER_AUTH_WEBHOOK_SECRET }}
          STRIPE_COMMERCE_WEBHOOK_SECRET: ${{ secrets.STRIPE_COMMERCE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          TURNSTILE_HOSTNAMES: ${{ vars.TURNSTILE_HOSTNAMES }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}

  real-e2e:
    name: Real Backend E2E
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_REAL_E2E == 'true' && vars.ENABLE_PRODUCTION_DEPLOYS == 'true' }}
    needs:
      - deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PLAYWRIGHT_API_URL: ${{ vars.SOUNDKIT_E2E_API_URL || 'https://api.mysoundkit.com' }}
      PLAYWRIGHT_BASE_URL: ${{ vars.SOUNDKIT_E2E_WEB_URL || 'https://mysoundkit.com' }}
      SOUNDKIT_E2E_ARTIST_EMAIL: ${{ secrets.SOUNDKIT_E2E_ARTIST_EMAIL }}
      SOUNDKIT_E2E_ARTIST_PASSWORD: ${{ secrets.SOUNDKIT_E2E_ARTIST_PASSWORD }}
      SOUNDKIT_E2E_EXPECT_CHECKOUT: ${{ vars.SOUNDKIT_E2E_EXPECT_CHECKOUT }}
      SOUNDKIT_E2E_EXPECT_PREMIUM_CHECKOUT: ${{ vars.SOUNDKIT_E2E_EXPECT_PREMIUM_CHECKOUT }}
      SOUNDKIT_E2E_FAN_EMAIL: ${{ secrets.SOUNDKIT_E2E_FAN_EMAIL }}
      SOUNDKIT_E2E_FAN_PASSWORD: ${{ secrets.SOUNDKIT_E2E_FAN_PASSWORD }}
      SOUNDKIT_E2E_SEARCH_STATE: ${{ vars.SOUNDKIT_E2E_SEARCH_STATE || 'AR' }}
      SOUNDKIT_REAL_E2E: "true"
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check real E2E credentials
        run: |
          missing=0
          for name in \
            PLAYWRIGHT_API_URL \
            PLAYWRIGHT_BASE_URL \
            SOUNDKIT_E2E_ARTIST_EMAIL \
            SOUNDKIT_E2E_ARTIST_PASSWORD \
            SOUNDKIT_E2E_FAN_EMAIL \
            SOUNDKIT_E2E_FAN_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required when ENABLE_REAL_E2E is true."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real backend E2E
        run: pnpm exec playwright test tests/e2e/real-backend.spec.ts --project=chromium --reporter=list

  preview:
    name: Deploy Preview
    needs:
      - verify
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    outputs:
      web_url: ${{ steps.urls.outputs.web_url }}
      api_url: ${{ steps.urls.outputs.api_url }}
      bio_url: ${{ steps.urls.outputs.bio_url }}
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR Workers share the production application database. Never synchronize
      # a branch-local Drizzle schema here: a stale branch can otherwise remove
      # columns introduced by another PR. Production applies the reviewed schema
      # before deploying the matching Worker version.
      - name: Confirm shared database safety policy
        run: |
          echo "Preview deploys use the existing shared schema without mutating it."
          echo "Schema-changing PRs must follow docs/preview-environments.md."

      - name: Deploy preview through Alchemy
        working-directory: packages/infra
        run: |
          for attempt in 1 2 3; do
            pnpm run deploy:stage --stage pr-${{ github.event.pull_request.number }} && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Preview deploy failed while Alchemy state workers may still be propagating. Retrying in 30 seconds..."
            sleep 30
          done
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_API_TOKEN }}
          CLOUDFLARE_STREAM_CUSTOMER_CODE: ${{ vars.CLOUDFLARE_STREAM_CUSTOMER_CODE }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ vars.ALCHEMY_STATE_FORCE_UPDATE }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REALTIMEKIT_APP_ID: ${{ vars.CLOUDFLARE_REALTIMEKIT_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_SERVER_DSN }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_SOUNDKIT_PREMIUM_ARTIST_ANNUAL_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_ARTIST_ANNUAL_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_ARTIST_MONTHLY_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_ARTIST_MONTHLY_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_FAN_ANNUAL_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_FAN_ANNUAL_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_FAN_MONTHLY_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_FAN_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_BETTER_AUTH_WEBHOOK_SECRET: ${{ secrets.STRIPE_BETTER_AUTH_WEBHOOK_SECRET }}
          STRIPE_COMMERCE_WEBHOOK_SECRET: ${{ secrets.STRIPE_COMMERCE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: Record preview URLs
        id: urls
        run: |
          WEB_URL="https://soundkit-web-pr-${{ github.event.pull_request.number }}.mysoundkit.com"
          API_URL="https://api-pr-${{ github.event.pull_request.number }}.mysoundkit.com"
          BIO_URL="https://bio-pr-${{ github.event.pull_request.number }}.mysoundkit.com"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "bio_url=$BIO_URL" >> "$GITHUB_OUTPUT"
          echo "### SoundKit preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bio: $BIO_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL" >> "$GITHUB_STEP_SUMMARY"

  preview-browser:
    name: Preview Browser Smoke Tests
    needs:
      - preview
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for preview deployment readiness
        run: |
          echo "Waiting for preview web, Bio, and API endpoints to be ready..."
          WEB_READY=false
          BIO_READY=false
          API_READY=false
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=4
          CONNECT_TIMEOUT_SECONDS=1
          REQUEST_TIMEOUT_SECONDS=2

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if [ "$API_READY" = false ]; then
              if curl --fail --silent --show-error \
                --connect-timeout "$CONNECT_TIMEOUT_SECONDS" \
                --max-time "$REQUEST_TIMEOUT_SECONDS" \
                "${PLAYWRIGHT_API_URL}/health" > /dev/null; then
                echo "API is ready ($PLAYWRIGHT_API_URL/health)"
                API_READY=true
              fi
            fi

            if [ "$WEB_READY" = false ]; then
              if curl --fail --silent --show-error \
                --connect-timeout "$CONNECT_TIMEOUT_SECONDS" \
                --max-time "$REQUEST_TIMEOUT_SECONDS" \
                "$PLAYWRIGHT_BASE_URL" > /dev/null; then
                echo "Web is ready ($PLAYWRIGHT_BASE_URL)"
                WEB_READY=true
              fi
            fi

            if [ "$BIO_READY" = false ]; then
              if curl --fail --silent --show-error \
                --connect-timeout "$CONNECT_TIMEOUT_SECONDS" \
                --max-time "$REQUEST_TIMEOUT_SECONDS" \
                "$PLAYWRIGHT_BIO_URL" > /dev/null; then
                echo "Bio is ready ($PLAYWRIGHT_BIO_URL)"
                BIO_READY=true
              fi
            fi

            if [ "$API_READY" = true ] && [ "$WEB_READY" = true ] && [ "$BIO_READY" = true ]; then
              echo "Preview deployment is ready!"
              exit 0
            fi

            echo "Attempt $attempt/$MAX_ATTEMPTS: Waiting for endpoints (API: $API_READY, Web: $WEB_READY)..."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Timed out waiting for preview deployment after $MAX_ATTEMPTS attempts."
          if [ "$API_READY" = false ]; then
            echo "API endpoint failed readiness: ${PLAYWRIGHT_API_URL}/health"
          fi
          if [ "$WEB_READY" = false ]; then
            echo "Web endpoint failed readiness: ${PLAYWRIGHT_BASE_URL}"
          fi
          if [ "$BIO_READY" = false ]; then
            echo "Bio endpoint failed readiness: ${PLAYWRIGHT_BIO_URL}"
          fi
          exit 1
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.web_url }}
          PLAYWRIGHT_BIO_URL: ${{ needs.preview.outputs.bio_url }}
          PLAYWRIGHT_API_URL: ${{ needs.preview.outputs.api_url }}

      - name: Run preview browser smoke tests
        run: pnpm exec playwright test tests/e2e/preview-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.web_url }}
          PLAYWRIGHT_API_URL: ${{ needs.preview.outputs.api_url }}
          PLAYWRIGHT_BIO_URL: ${{ needs.preview.outputs.bio_url }}
          SOUNDKIT_E2E_WEB_URL: ${{ needs.preview.outputs.web_url }}
          SOUNDKIT_E2E_API_URL: ${{ needs.preview.outputs.api_url }}

      - name: Report Playwright failure artifacts
        if: failure()
        run: |
          echo "Playwright failure artifacts remain available in the runner workspace for this run." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Destroy Preview
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Bootstrap repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Destroy preview through Alchemy
        working-directory: packages/infra
        run: |
          for attempt in 1 2 3; do
            pnpm run destroy:stage --stage pr-${{ github.event.pull_request.number }} && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Preview cleanup failed while Alchemy state workers may still be propagating. Retrying in 30 seconds..."
            sleep 30
          done
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ vars.ALCHEMY_STATE_FORCE_UPDATE }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_SOUNDKIT_PREMIUM_ARTIST_ANNUAL_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_ARTIST_ANNUAL_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_ARTIST_MONTHLY_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_ARTIST_MONTHLY_PRICE_ID }}
          STRIPE_SOUNDKIT_PREMIUM_FAN_ANNUAL_PRICE_ID: ${{ vars.STRIPE_SOUNDKIT_PREMIUM_FAN_ANNUAL_PRICE_ID }}
