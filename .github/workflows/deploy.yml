name: Verify and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    env:
      SOUNDKIT_CI_STATIC_CONFIG: "true"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Run unit and Worker tests
        run: bun run test

      - name: Build applications
        run: bun run build

  browser:
    name: Browser Smoke Tests
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    env:
      SOUNDKIT_CI_STATIC_CONFIG: "true"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: bun run test:e2e

  deploy:
    name: Deploy Production
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOYS == 'true' }}
    needs:
      - verify
      - browser
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Alchemy Cloudflare profile
        run: |
          mkdir -p "$HOME/.alchemy/credentials/default"
          printf '%s' "$ALCHEMY_CONFIG_JSON" > "$HOME/.alchemy/config.json"
          printf '%s' "$ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON" > "$HOME/.alchemy/credentials/default/cloudflare.json"
        env:
          ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON: ${{ secrets.ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON }}
          ALCHEMY_CONFIG_JSON: ${{ secrets.ALCHEMY_CONFIG_JSON }}

      - name: Apply production auth schema patches
        working-directory: packages/db
        run: |
          bun --eval '
          import { Pool } from "pg";

          const databaseUrl = process.env.DATABASE_URL;

          if (!databaseUrl) {
            throw new Error("DATABASE_URL is required for production auth schema patches.");
          }

          const pool = new Pool({ connectionString: databaseUrl, max: 1 });

          try {
            await pool.query(`alter table if exists "user" add column if not exists "stripe_customer_id" text`);
            await pool.query(`alter table if exists "organization" add column if not exists "stripe_customer_id" text`);
            await pool.query(`alter table if exists "subscription" add column if not exists "stripe_customer_id" text`);
          } finally {
            await pool.end();
          }
          '
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy through Alchemy
        working-directory: packages/infra
        run: bun run deploy
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_ARTIST_LITE_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_LITE_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_LITE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_LITE_MONTHLY_PRICE_ID }}
          STRIPE_ARTIST_TEAM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID }}
          STRIPE_FAN_FAMILY_ANNUAL_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_ANNUAL_PRICE_ID }}
          STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID }}
          STRIPE_FAN_LITE_ANNUAL_PRICE_ID: ${{ vars.STRIPE_FAN_LITE_ANNUAL_PRICE_ID }}
          STRIPE_FAN_LITE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_LITE_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

  preview:
    name: Deploy Preview
    needs:
      - verify
      - browser
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Alchemy Cloudflare profile
        run: |
          mkdir -p "$HOME/.alchemy/credentials/default"
          printf '%s' "$ALCHEMY_CONFIG_JSON" > "$HOME/.alchemy/config.json"
          printf '%s' "$ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON" > "$HOME/.alchemy/credentials/default/cloudflare.json"
        env:
          ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON: ${{ secrets.ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON }}
          ALCHEMY_CONFIG_JSON: ${{ secrets.ALCHEMY_CONFIG_JSON }}

      - name: Deploy preview through Alchemy
        working-directory: packages/infra
        run: bun run deploy:stage --stage pr-${{ github.event.pull_request.number }}
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_ARTIST_LITE_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_LITE_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_LITE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_LITE_MONTHLY_PRICE_ID }}
          STRIPE_ARTIST_TEAM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID }}
          STRIPE_FAN_FAMILY_ANNUAL_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_ANNUAL_PRICE_ID }}
          STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID }}
          STRIPE_FAN_LITE_ANNUAL_PRICE_ID: ${{ vars.STRIPE_FAN_LITE_ANNUAL_PRICE_ID }}
          STRIPE_FAN_LITE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_LITE_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Record preview URLs
        run: |
          echo "### SoundKit preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: https://web-pr-${{ github.event.pull_request.number }}.mysoundkit.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://api-pr-${{ github.event.pull_request.number }}.mysoundkit.com" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Destroy Preview
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Alchemy Cloudflare profile
        run: |
          mkdir -p "$HOME/.alchemy/credentials/default"
          printf '%s' "$ALCHEMY_CONFIG_JSON" > "$HOME/.alchemy/config.json"
          printf '%s' "$ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON" > "$HOME/.alchemy/credentials/default/cloudflare.json"
        env:
          ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON: ${{ secrets.ALCHEMY_CLOUDFLARE_CREDENTIALS_JSON }}
          ALCHEMY_CONFIG_JSON: ${{ secrets.ALCHEMY_CONFIG_JSON }}

      - name: Destroy preview through Alchemy
        working-directory: packages/infra
        run: bun run destroy:stage --stage pr-${{ github.event.pull_request.number }}
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_ARTIST_LITE_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_LITE_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_LITE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_LITE_MONTHLY_PRICE_ID }}
          STRIPE_ARTIST_TEAM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID }}
          STRIPE_FAN_FAMILY_ANNUAL_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_ANNUAL_PRICE_ID }}
          STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID }}
          STRIPE_FAN_LITE_ANNUAL_PRICE_ID: ${{ vars.STRIPE_FAN_LITE_ANNUAL_PRICE_ID }}
          STRIPE_FAN_LITE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_LITE_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
