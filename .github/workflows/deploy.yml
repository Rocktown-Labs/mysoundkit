name: Verify and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Verify
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    env:
      SOUNDKIT_CI_STATIC_CONFIG: "true"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run check-types

      - name: Run unit and Worker tests
        run: pnpm run test

      - name: Build applications
        run: pnpm run build

  browser:
    name: Browser Smoke Tests
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    env:
      SOUNDKIT_CI_STATIC_CONFIG: "true"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm run test:e2e

  deploy:
    name: Deploy Production
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOYS == 'true' }}
    needs:
      - verify
      - browser
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production database schema
        working-directory: packages/db
        run: |
          node --input-type=module --eval '
          import { Pool } from "pg";

          const databaseUrl = process.env.DATABASE_URL?.replace(
            "sslmode=verify-full",
            "sslmode=require"
          );

          if (!databaseUrl) {
            throw new Error("DATABASE_URL is required to apply the production database schema.");
          }

          const pool = new Pool({ connectionString: databaseUrl, max: 1 });

          try {
            await pool.query("create extension if not exists vector");
          } finally {
            await pool.end();
          }
          '
          export DATABASE_URL="${DATABASE_URL/sslmode=verify-full/sslmode=require}"
          pnpm exec drizzle-kit push --config drizzle.config.ts --force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy through Alchemy
        working-directory: packages/infra
        run: pnpm run deploy
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ vars.ALCHEMY_STATE_FORCE_UPDATE }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_SERVER_DSN }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_ARTIST_PREMIUM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_PREMIUM_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_PREMIUM_MONTHLY_PRICE_ID }}
          STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID }}
          STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID }}
          STRIPE_LISTENER_PREMIUM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_LISTENER_PREMIUM_ANNUAL_PRICE_ID }}
          STRIPE_LISTENER_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_LISTENER_PREMIUM_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VITE_RADAR_PUBLISHABLE_KEY: ${{ vars.VITE_RADAR_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

  preview:
    name: Deploy Preview
    needs:
      - verify
      - browser
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply preview database schema
        working-directory: packages/db
        run: |
          node --input-type=module --eval '
          import { Pool } from "pg";

          const databaseUrl = process.env.DATABASE_URL?.replace(
            "sslmode=verify-full",
            "sslmode=require"
          );

          if (!databaseUrl) {
            throw new Error("DATABASE_URL is required to apply the preview database schema.");
          }

          const pool = new Pool({ connectionString: databaseUrl, max: 1 });

          try {
            await pool.query("create extension if not exists vector");
          } finally {
            await pool.end();
          }
          '
          export DATABASE_URL="${DATABASE_URL/sslmode=verify-full/sslmode=require}"
          pnpm exec drizzle-kit push --config drizzle.config.ts --force
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy preview through Alchemy
        working-directory: packages/infra
        run: |
          for attempt in 1 2 3; do
            pnpm run deploy:stage --stage pr-${{ github.event.pull_request.number }} && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Preview deploy failed while Alchemy state workers may still be propagating. Retrying in 30 seconds..."
            sleep 30
          done
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ vars.ALCHEMY_STATE_FORCE_UPDATE }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_SERVER_DSN }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_ARTIST_PREMIUM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_PREMIUM_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_PREMIUM_MONTHLY_PRICE_ID }}
          STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID }}
          STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID }}
          STRIPE_LISTENER_PREMIUM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_LISTENER_PREMIUM_ANNUAL_PRICE_ID }}
          STRIPE_LISTENER_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_LISTENER_PREMIUM_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VITE_RADAR_PUBLISHABLE_KEY: ${{ vars.VITE_RADAR_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      - name: Record preview URLs
        run: |
          echo "### SoundKit preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: https://web-pr-${{ github.event.pull_request.number }}.mysoundkit.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://api-pr-${{ github.event.pull_request.number }}.mysoundkit.com" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Destroy Preview
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_PREVIEW_DEPLOYS == 'true' }}
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Destroy preview through Alchemy
        working-directory: packages/infra
        run: |
          for attempt in 1 2 3; do
            pnpm run destroy:stage --stage pr-${{ github.event.pull_request.number }} && exit 0
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Preview cleanup failed while Alchemy state workers may still be propagating. Retrying in 30 seconds..."
            sleep 30
          done
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALCHEMY_STATE_FORCE_UPDATE: ${{ vars.ALCHEMY_STATE_FORCE_UPDATE }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_EMBEDDING_MODEL: ${{ vars.GOOGLE_EMBEDDING_MODEL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          MUX_WEBHOOK_SECRET: ${{ secrets.MUX_WEBHOOK_SECRET }}
          STEMSPLIT_API_KEY: ${{ secrets.STEMSPLIT_API_KEY }}
          STEMSPLIT_WEBHOOK_SECRET: ${{ secrets.STEMSPLIT_WEBHOOK_SECRET }}
          STRIPE_ARTIST_PREMIUM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_ARTIST_PREMIUM_ANNUAL_PRICE_ID }}
          STRIPE_ARTIST_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_PREMIUM_MONTHLY_PRICE_ID }}
          STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_ARTIST_TEAM_MONTHLY_PRICE_ID }}
          STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID: ${{ vars.STRIPE_FAN_FAMILY_MONTHLY_PRICE_ID }}
          STRIPE_LISTENER_PREMIUM_ANNUAL_PRICE_ID: ${{ vars.STRIPE_LISTENER_PREMIUM_ANNUAL_PRICE_ID }}
          STRIPE_LISTENER_PREMIUM_MONTHLY_PRICE_ID: ${{ vars.STRIPE_LISTENER_PREMIUM_MONTHLY_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
