name: RealtimeKit Presets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation to run"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - delete

concurrency:
  group: realtimekit-presets
  cancel-in-progress: false

jobs:
  presets:
    name: Apply RealtimeKit presets (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run preset script
        working-directory: packages/infra
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            bun realtimekit-presets.ts
          elif [ "${{ github.event.inputs.mode }}" = "delete" ]; then
            bun realtimekit-presets.ts --delete
          else
            bun realtimekit-presets.ts --dry-run
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_REALTIMEKIT_APP_ID: ${{ vars.CLOUDFLARE_REALTIMEKIT_APP_ID }}