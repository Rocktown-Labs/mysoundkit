<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundKit</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">SoundKit</p>
      <h1>You're offline</h1>
      <p class="description">Check your connection, then try again.</p>
      <a class="retry" href="https://mysoundkit.com" id="retry">Try again</a>
    </main>
    <script>
      {
        const target = new URLSearchParams(window.location.search).get(
          "target"
        );

        if (target) {
          document.getElementById("retry").href = target;
        }
      }
    </script>
    <style>
      body {
        align-items: center;
        background: #0d0d0d;
        color: #f5f5f5;
        display: flex;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        height: 100vh;
        justify-content: center;
        margin: 0;
      }

      main {
        text-align: center;
      }

      .eyebrow {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        margin: 0 0 0.5rem;
        text-transform: uppercase;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }

      .description {
        color: #a3a3a3;
        font-size: 0.875rem;
        margin: 0 0 2rem;
      }

      .retry {
        background: #f5f5f5;
        border-radius: 9999px;
        color: #0d0d0d;
        display: inline-block;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.625rem 1.5rem;
        text-decoration: none;
      }

      .retry:hover {
        background: #ffffff;
      }
    </style>
  </body>
</html>
