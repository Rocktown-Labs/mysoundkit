<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundKit - Regional Empty State & Fallback Prototype</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #09090b;
        --card: #121215;
        --card-muted: #18181b;
        --border: rgba(255, 255, 255, 0.08);
        --border-subtle: rgba(255, 255, 255, 0.04);
        --text: #f4f4f5;
        --text-muted: #a1a1aa;
        --text-dim: #71717a;
        --primary: #f59e0b; /* SoundKit amber/gold or clean white */
        --primary-foreground: #000;
        --accent: #27272a;
        --radius: 12px;
        --font-sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        min-height: 100vh;
        padding-bottom: 96px;
        -webkit-font-smoothing: antialiased;
      }

      /* Top fake navigation to provide realistic surrounding context */
      header.fake-nav {
        height: 56px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .brand {
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
      }
      .nav-links {
        display: flex;
        gap: 20px;
        font-size: 13px;
        color: var(--text-muted);
      }
      .nav-links span.active {
        color: var(--text);
        font-weight: 500;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px;
      }

      .scene-meta-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .scene-title-group h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .scene-title-group p {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-muted);
      }
      .badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #eab308;
      }

      /* Trending songs rail mockup */
      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin: 28px 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-subtitle {
        font-size: 13px;
        font-weight: 400;
        color: var(--text-muted);
        margin-left: 8px;
      }
      .grid-tracks {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }
      .track-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        padding: 10px;
        transition:
          transform 180ms ease-out,
          border-color 180ms ease-out;
      }
      .track-card:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.16);
      }
      .track-art {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 6px;
        background: #27272a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-size: 24px;
        margin-bottom: 8px;
      }
      .track-title {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-artist {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* Button styles */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: all 150ms ease-out;
        border: 1px solid transparent;
        user-select: none;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: #ffffff;
        color: #000000;
      }
      .btn-primary:hover {
        background: #e4e4e7;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--border);
        color: var(--text);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .btn-outline {
        background: transparent;
        border-color: var(--border);
        color: var(--text-muted);
      }
      .btn-outline:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* ─────────────────────────────────────────────────────────────
       SPEC PICKER STYLES (from PICKER.md - DO NOT ALTER)
       ───────────────────────────────────────────────────────────── */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }

      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight {
          transition: none;
        }
      }

      .proto-picker-item {
        position: relative;
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }

      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .proto-picker-item:active {
        transform: scale(0.97);
      }

      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }

      .proto-picker-item[data-active] {
        color: #fff;
      }

      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }

      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header class="fake-nav">
      <div class="brand">
        <div class="brand-dot"></div>
        SoundKit
      </div>
      <div class="nav-links">
        <span class="active">Discover</span>
        <span>Tracks</span>
        <span>Artists</span>
        <span>Live</span>
      </div>
      <div class="badge">
        <div class="badge-dot"></div>
        Virginia, US
      </div>
    </header>

    <div id="stage"></div>

    <!-- The Spec Picker -->
    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" data-active aria-current="true">
        Quiet
      </button>
      <button class="proto-picker-item">Editorial</button>
      <button class="proto-picker-item">Split</button>
      <span class="proto-picker-divider" aria-hidden="true"></span>
      <button
        class="proto-picker-item proto-picker-replay"
        aria-label="Replay (R)"
      >
        ↻
      </button>
    </nav>

    <script>
      // Shared trending tracks mockup
      const trendingTracksMarkup = `
      <div class="section-title">
        <div>
          Trending Across SoundKit
          <span class="section-subtitle">What's ringing out globally while Virginia warms up</span>
        </div>
      </div>
      <div class="grid-tracks">
        <div class="track-card">
          <div class="track-art">🎵</div>
          <div class="track-title">Midnight Skyline</div>
          <div class="track-artist">Marcus Vance · 42.1K plays</div>
        </div>
        <div class="track-card">
          <div class="track-art">🎹</div>
          <div class="track-title">Delta Motion (Prod. Dex)</div>
          <div class="track-artist">Dexter Kane · 28.9K plays</div>
        </div>
        <div class="track-card">
          <div class="track-art">⚡</div>
          <div class="track-title">Southside Frequency</div>
          <div class="track-artist">Aria Chen · 19.4K plays</div>
        </div>
        <div class="track-card">
          <div class="track-art">🔥</div>
          <div class="track-title">Late Night Session</div>
          <div class="track-artist">The Rhythm Club · 15.2K plays</div>
        </div>
      </div>
    `;

      // ─────────────────────────────────────────────────────────────
      // VARIANT 1: Quiet
      // Axis: Restrained, compact, utility-first inline notice.
      // ─────────────────────────────────────────────────────────────
      function renderQuiet() {
        return `
        <div class="container">
          <div class="scene-meta-bar">
            <div class="scene-title-group">
              <h1>Discover Music</h1>
              <p>Viewing music stats focused on Virginia.</p>
            </div>
            <button class="btn btn-outline" onclick="alert('Switched to Global View')">
              ← Reset to Global View
            </button>
          </div>

          <div style="
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
          ">
            <div style="max-width: 580px;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                <span style="font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.06em; color: var(--text-dim);">
                  Virginia Scene
                </span>
                <span style="width: 3px; height: 3px; border-radius: 50%; background: var(--text-dim);"></span>
                <span style="font-size: 12px; color: var(--text-muted);">Early Access</span>
              </div>
              <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">
                No music published in Virginia yet
              </h2>
              <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5;">
                You're early to this scene. While local artists and producers upload their catalog, we've loaded top music from across SoundKit below.
              </p>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <button class="btn btn-secondary" onclick="alert('Switched to Global')">
                View Global
              </button>
              <button class="btn btn-primary" onclick="alert('Redirecting to /signup/artist')">
                Publish from Virginia →
              </button>
            </div>
          </div>

          ${trendingTracksMarkup}
        </div>
      `;
      }

      // ─────────────────────────────────────────────────────────────
      // VARIANT 2: Editorial
      // Axis: Typographic, confident cultural presence, generous space.
      // ─────────────────────────────────────────────────────────────
      function renderEditorial() {
        return `
        <div class="container">
          <div class="scene-meta-bar">
            <div class="scene-title-group">
              <h1>Discover Music</h1>
              <p>Viewing music stats focused on Virginia.</p>
            </div>
            <button class="btn btn-outline" onclick="alert('Switched to Global View')">
              ← Reset to Global View
            </button>
          </div>

          <div style="
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 32px;
            margin-bottom: 32px;
          ">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary);">
              Virginia · Scene Unclaimed
            </span>
            <h2 style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 10px 0 10px; max-width: 640px;">
              Be the first artist to put Virginia on the map.
            </h2>
            <p style="font-size: 14px; color: var(--text-muted); max-width: 540px; line-height: 1.6; margin-bottom: 24px;">
              SoundKit local leaderboards rank artists by community plays and beat battles. Upload your tracks to claim the #1 spot in Virginia before anyone else.
            </p>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
              <button class="btn btn-primary" onclick="alert('Redirecting to /signup/artist')">
                Claim the Virginia Leaderboard
              </button>
              <button class="btn btn-secondary" onclick="alert('Switched to Global')">
                Browse Global Trending
              </button>
            </div>
          </div>

          ${trendingTracksMarkup}
        </div>
      `;
      }

      // ─────────────────────────────────────────────────────────────
      // VARIANT 3: Split
      // Axis: Distinct dual cards — one for listener, one for creator.
      // ─────────────────────────────────────────────────────────────
      function renderSplit() {
        return `
        <div class="container">
          <div class="scene-meta-bar">
            <div class="scene-title-group">
              <h1>Discover Music</h1>
              <p>Viewing music stats focused on Virginia.</p>
            </div>
            <button class="btn btn-outline" onclick="alert('Switched to Global View')">
              ← Reset to Global View
            </button>
          </div>

          <div style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
          ">
            <!-- Listener Card -->
            <div style="
              background: var(--card);
              border: 1px solid var(--border);
              border-radius: var(--radius);
              padding: 22px;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
            ">
              <div>
                <span style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim);">
                  For Listeners
                </span>
                <h3 style="font-size: 16px; font-weight: 600; margin: 6px 0 6px;">
                  No releases in Virginia yet
                </h3>
                <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px;">
                  You are among the first visitors from Virginia. Switch to global app-wide totals to stream top songs right now.
                </p>
              </div>
              <button class="btn btn-secondary" style="width: 100%;" onclick="alert('Switched to Global')">
                Switch to Global Scene
              </button>
            </div>

            <!-- Creator Card -->
            <div style="
              background: var(--card);
              border: 1px solid rgba(255, 255, 255, 0.12);
              border-radius: var(--radius);
              padding: 22px;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
            ">
              <div>
                <span style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim);">
                  For Creators & Producers
                </span>
                <h3 style="font-size: 16px; font-weight: 600; margin: 6px 0 6px;">
                  Represent Virginia
                </h3>
                <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px;">
                  Upload your singles, beat kits, or music videos to lead the Virginia rankings and get discovered by local fans.
                </p>
              </div>
              <button class="btn btn-primary" style="width: 100%;" onclick="alert('Redirecting to /signup/artist')">
                Join as Virginia Creator →
              </button>
            </div>
          </div>

          ${trendingTracksMarkup}
        </div>
      `;
      }

      // ─────────────────────────────────────────────────────────────
      // SPEC HARNESS WIRING (from PICKER.md)
      // ─────────────────────────────────────────────────────────────
      const variants = [renderQuiet, renderEditorial, renderSplit];
      const stage = document.getElementById("stage");
      const picker = document.querySelector(".proto-picker");
      const highlight = picker.querySelector(".proto-picker-highlight");
      const items = [
        ...picker.querySelectorAll(
          ".proto-picker-item:not(.proto-picker-replay)"
        ),
      ];
      const replay = picker.querySelector(".proto-picker-replay");
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + "px";
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = "";
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute("data-active", j === i);
          if (j === i) el.setAttribute("aria-current", "true");
          else el.removeAttribute("aria-current");
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set("v", i + 1);
        history.replaceState(null, "", url);
        mount(i);
      }

      items.forEach((el, i) =>
        el.addEventListener("click", () => setActive(i))
      );
      replay?.addEventListener("click", () => mount(current));
      window.addEventListener("resize", moveHighlight);

      document.addEventListener("keydown", (e) => {
        if (
          /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) ||
          e.target.isContentEditable
        )
          return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === "ArrowRight")
          setActive((current + 1) % variants.length);
        else if (e.key === "ArrowLeft")
          setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === "r" || e.key === "R") mount(current);
      });

      setActive(
        (parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1
      );
      requestAnimationFrame(() =>
        requestAnimationFrame(() => picker.setAttribute("data-ready", ""))
      );
    </script>
  </body>
</html>
